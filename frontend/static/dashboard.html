<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KohaGuard Analytics</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f9;color:#142033}.header{background:#132238;color:#fff;padding:22px 30px}.wrap{max-width:1250px;margin:30px auto;padding:15px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.card,.panel{background:#fff;border-radius:16px;box-shadow:0 6px 22px rgba(0,0,0,.06)}.card{padding:20px}.value{font-size:34px;font-weight:800}.label{color:#667085;font-size:13px}.panel{margin-top:20px;padding:20px}.toolbar{display:flex;justify-content:space-between;align-items:center}.btn{padding:11px 16px;border-radius:10px;background:#132238;color:#fff;text-decoration:none;font-weight:700}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #eaecf0;text-align:left;font-size:14px}th{background:#f8fafc}.AUTHORIZED{color:#087a3e;font-weight:700}.STOP{color:#b42318;font-weight:700}.UNKNOWN{color:#475467;font-weight:700}.REVIEW{color:#b54708;font-weight:700}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.panel{overflow-x:auto}}</style></head><body><div class="header"><h1>📊 KohaGuard Analytics</h1><div>Library Exit Verification Dashboard</div></div><div class="wrap"><div class="cards"><div class="card"><div id="total" class="value">0</div><div class="label">Total Scans</div></div><div class="card"><div id="authorized" class="value">0</div><div class="label">Authorized</div></div><div class="card"><div id="blocked" class="value">0</div><div class="label">Blocked</div></div><div class="card"><div id="unknown" class="value">0</div><div class="label">Unknown</div></div><div class="card"><div id="today" class="value">0</div><div class="label">Today</div></div><div class="card"><div id="avg" class="value">0</div><div class="label">Avg Response ms</div></div></div><div class="panel"><div class="toolbar"><h2>Recent Scan History</h2><a class="btn" href="api/analytics/export.csv">⬇ Export CSV</a></div><table><thead><tr><th>Date / Time</th><th>Barcode</th><th>Title</th><th>Status</th><th>Source</th><th>Response</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>function e(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}async function load(){const r=await fetch('api/analytics/summary'),d=await r.json();for(const k of ['total','authorized','blocked','unknown','today'])document.getElementById(k).textContent=d[k];document.getElementById('avg').textContent=d.avg_response_ms;const b=document.getElementById('rows');b.innerHTML='';for(const x of d.recent){const tr=document.createElement('tr');tr.innerHTML='<td>'+e(x.timestamp)+'</td><td>'+e(x.barcode)+'</td><td>'+e(x.title)+'</td><td class="'+e(x.status)+'">'+e(x.status)+'</td><td>'+e(x.scan_source)+'</td><td>'+e(x.response_time_ms)+' ms</td>';b.appendChild(tr)}}load();setInterval(load,5000)</script></body></html>
