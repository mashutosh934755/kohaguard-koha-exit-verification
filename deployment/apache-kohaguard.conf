# Example Apache reverse proxy. Replace YOUR-HOST and certificate paths.
# Enable modules: ssl proxy proxy_http headers

<VirtualHost *:443>
    ServerName YOUR-HOST

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/YOUR-HOST/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/YOUR-HOST/privkey.pem

    ProxyPreserveHost On
    ProxyPass /kohaguard/ http://127.0.0.1:8096/
    ProxyPassReverse /kohaguard/ http://127.0.0.1:8096/
    RequestHeader set X-Forwarded-Proto "https"

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"

    ErrorLog ${APACHE_LOG_DIR}/kohaguard_error.log
    CustomLog ${APACHE_LOG_DIR}/kohaguard_access.log combined
</VirtualHost>
